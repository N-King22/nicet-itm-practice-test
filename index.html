const TEST_SIZE = 25;
let current = [];
let submitted = false;

function shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]];} return b; }

function newTest(){
  submitted = false;
  const f = document.getElementById('src').value;
  const pool = shuffle(BANK.filter(q => f==='ALL' || q[0]===f));
  current = pool.slice(0, Math.min(TEST_SIZE, pool.length)).map(q => {
    const opts = shuffle([{t:q[2],ok:true},{t:q[3],ok:false},{t:q[4],ok:false},{t:q[5],ok:false}]);
    return {cat:q[0], q:q[1], opts, expl:q[6], sel:null};
  });
  render();
  window.scrollTo(0,0);
}

function render(){
  const quiz = document.getElementById('quiz');
  quiz.innerHTML = '';
  current.forEach((it,i)=>{
    const d = document.createElement('div'); d.className='card';
    d.innerHTML = `<div class="tag">${esc(it.cat)} • Question ${i+1}</div><div class="q">${esc(it.q)}</div>`;
    it.opts.forEach((o,j)=>{
      const l = document.createElement('label');
      l.innerHTML = `<input type="radio" name="q${i}" value="${j}" ${it.sel===j?'checked':''} ${submitted?'disabled':''}> ${String.fromCharCode(65+j)}. ${esc(o.t)}`;
      l.querySelector('input').onchange = ()=>{ it.sel=j; updateProgress(); };
      if(submitted){
        if(o.ok) l.classList.add('correct');
        else if(it.sel===j) l.classList.add('wrong');
      }
      d.appendChild(l);
    });
    if(submitted){
      const e = document.createElement('div'); e.className='expl';
      const right = it.sel!==null && it.opts[it.sel].ok;
      e.innerHTML = `<b>${it.sel===null?'Unanswered':right?'Correct':'Incorrect'}.</b> ${esc(it.expl)}`;
      d.appendChild(e);
    }
    quiz.appendChild(d);
  });
  const a = document.getElementById('actions');
  a.innerHTML = submitted ? '' : '<button id="sub">Submit for Grading</button>';
  if(!submitted) document.getElementById('sub').onclick = grade;
  updateProgress();
}

function updateProgress(){
  const n = current.filter(c=>c.sel!==null).length;
  document.getElementById('progress').textContent = submitted ? 'Graded' : `Answered ${n} of ${current.length}`;
}

function grade(){
  const un = current.filter(c=>c.sel===null).length;
  if(un && !confirm(`${un} question(s) unanswered. Submit anyway?`)) return;
  submitted = true;
  const score = current.filter(c=>c.sel!==null && c.opts[c.sel].ok).length;
  const pct = Math.round(score/current.length*100);
  render();
  const a = document.getElementById('actions');
  a.innerHTML = `<div id="result">Score: ${score} / ${current.length} (${pct}%) <span class="${pct>=70?'pass':'fail'}">${pct>=70?'PASS (70%+)':'Below 70% – keep studying'}</span></div>
    <p>Review the highlighted answers and explanations above.</p>
    <button id="again">Take a New Test</button> <button class="alt" id="top">Back to Top</button>`;
  document.getElementById('again').onclick = newTest;
  document.getElementById('top').onclick = ()=>window.scrollTo(0,0);
  a.scrollIntoView({behavior:'smooth'});
}

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

document.getElementById('src').onchange = newTest;
newTest();
</script>
